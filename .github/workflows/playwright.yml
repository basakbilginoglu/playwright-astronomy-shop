
name: Playwright and Performance Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      performance_test:
        description: 'Çalıştırılacak k6 testi'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - baseline
          - load
          - spike

env:
  CI: true
  BASE_URL: http://localhost:8080

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Playwright project
        uses: actions/checkout@v4

      - name: Checkout OpenTelemetry Demo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 0aeadb11cf3ecaac318bacd1986f23eff531c8f5
          path: opentelemetry-demo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Astronomy Shop
        run: |
          docker compose \
            --project-directory opentelemetry-demo \
            --env-file opentelemetry-demo/.env \
            --env-file opentelemetry-demo/.env.override \
            -f opentelemetry-demo/compose.yaml \
            -f docker/compose.ci.yaml \
            up -d --build --wait --wait-timeout 300 frontend

          curl --fail --silent --show-error \
            --retry 30 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 10 \
            http://localhost:8080/ \
            -o /dev/null

      - name: Run Playwright tests
        run: npx playwright test

      # PR ve push işlemlerinde kısa smoke testi
      - name: Run k6 smoke test
        if: github.event_name != 'workflow_dispatch' || inputs.performance_test == 'smoke'
        run: |
          mkdir -p evidence/ci
          set -o pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6 run performance/checkout-smoke.js \
            | tee evidence/ci/checkout-smoke-results.txt

      # Manuel baseline testi
      - name: Run k6 baseline test
        if: github.event_name == 'workflow_dispatch' && inputs.performance_test == 'baseline'
        run: |
          mkdir -p evidence/ci
          set -o pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6 run performance/checkout-baseline.js \
            | tee evidence/ci/checkout-baseline-results.txt

      # Manuel staged load testi
      - name: Run k6 load test
        if: github.event_name == 'workflow_dispatch' && inputs.performance_test == 'load'
        run: |
          mkdir -p evidence/ci
          set -o pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6 run performance/checkout-load.js \
            | tee evidence/ci/checkout-load-results.txt

      # Manuel spike testi
      - name: Run k6 spike test
        if: github.event_name == 'workflow_dispatch' && inputs.performance_test == 'spike'
        run: |
          mkdir -p evidence/ci
          set -o pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6 run performance/checkout-spike.js \
            | tee evidence/ci/checkout-spike-results.txt

      - name: Collect Docker logs
        if: failure()
        run: |
          docker compose \
            --project-directory opentelemetry-demo \
            --env-file opentelemetry-demo/.env \
            --env-file opentelemetry-demo/.env.override \
            -f opentelemetry-demo/compose.yaml \
            -f docker/compose.ci.yaml \
            ps || true

          docker compose \
            --project-directory opentelemetry-demo \
            --env-file opentelemetry-demo/.env \
            --env-file opentelemetry-demo/.env.override \
            -f opentelemetry-demo/compose.yaml \
            -f docker/compose.ci.yaml \
            logs --no-color --tail=100 || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results
          path: evidence/ci/
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop Astronomy Shop
        if: always()
        run: |
          docker compose \
            --project-directory opentelemetry-demo \
            --env-file opentelemetry-demo/.env \
            --env-file opentelemetry-demo/.env.override \
            -f opentelemetry-demo/compose.yaml \
            -f docker/compose.ci.yaml \
            down -v --remove-orphans
